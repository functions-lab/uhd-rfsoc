# Release: on a v* tag, run CI, then publish a GitHub release with the host
# module built for Ubuntu 24.04 (x86_64, aarch64). No bitstreams here: they
# are built with Vivado outside CI and published in the uhd-rfsoc-bitstream
# repository (the bitstreams/ submodule) and its releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: host-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: uhd-rfsoc ${{ github.ref_name }}
          body: |
            Host module for Ubuntu 24.04, x86_64 and aarch64 (`uhd-rfsoc-host-*.tar.gz`, `SHA256SUMS`).

            Prebuilt bitstreams for this version, one zip per board and PYNQ version:
            https://github.com/functions-lab/uhd-rfsoc-bitstream/releases/tag/${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            *.tar.gz
            SHA256SUMS
